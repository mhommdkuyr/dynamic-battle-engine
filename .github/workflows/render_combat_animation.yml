name: Render Combat Animation & Publish Video

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      target_resolution:
        description: 'Output resolution'
        required: false
        default: '1080p'

jobs:
  render_combat_video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Rendering Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install opencv-python-headless numpy scipy pillow pyyaml

      - name: Run Combat Animation Engine
        run: |
          python scripts/run_render.py

      - name: Upload Video Artifact (Ready for Publishing)
        uses: actions/upload-artifact@v4
        with:
          name: combat-animation-60fps-ready-to-publish
          path: |
            output/*.mp4
            output/*.png
          retention-days: 30
