name: Prism Break — CPU 3D/2D Animation Pipeline

on:
  workflow_dispatch:
    inputs:
      run_colmap:
        description: "Run optional COLMAP sparse 3D camera analysis on the Drive reference"
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "scripts/render_prism_break.py"
      - "scripts/build_blender_scene.py"
      - "scripts/analyze_reference.py"
      - "scripts/solve_camera_colmap.py"
      - "scripts/drive_io.py"
      - "scripts/generate_score.py"
      - "scripts/render_bundle/**"
      - ".github/workflows/render_prism_break.yml"

permissions:
  contents: write

concurrency:
  group: prism-break-render-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render-original-episode:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
      GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
      GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
      GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
      GOOGLE_DRIVE_OUTPUT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_OUTPUT_FOLDER_ID }}
      GOOGLE_DRIVE_REFERENCE_FILE_ID: ${{ secrets.GOOGLE_DRIVE_REFERENCE_FILE_ID }}
      GOOGLE_DRIVE_REFERENCE_NAME: "Red vs Black 2023 (by MicroMist)_720p.mp4"

    steps:
      - name: Check out animation project
        uses: actions/checkout@v4

      - name: Install CPU rendering tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y blender ffmpeg
          blender --version | head -n 2
          ffmpeg -version | head -n 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy opencv-python-headless pillow

      - name: Compile-check pipeline scripts and run engine tests
        run: |
          python -m py_compile \
            scripts/render_prism_break.py \
            scripts/build_blender_scene.py \
            scripts/analyze_reference.py \
            scripts/solve_camera_colmap.py \
            scripts/drive_io.py \
            scripts/generate_score.py
          python -m unittest discover -s tests -v

      - name: Smoke-test fast CPU renderer
        run: |
          mkdir -p output
          python scripts/render_prism_break.py \
            --output output/smoke-test.mp4 --duration 2 --fps 12
          test -s output/smoke-test.mp4
          ffprobe -v error -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 output/smoke-test.mp4
          rm -f output/smoke-test.mp4 output/smoke-test.json \
            output/smoke-test_score.wav output/smoke-test_raw.mp4

      - name: Download Drive reference for timing and motion diagnostics
        id: reference
        continue-on-error: true
        run: |
          if [ -z "$GOOGLE_DRIVE_CLIENT_ID" ] || \
             [ -z "$GOOGLE_DRIVE_CLIENT_SECRET" ] || \
             [ -z "$GOOGLE_DRIVE_REFRESH_TOKEN" ] || \
             { [ -z "$GOOGLE_DRIVE_FOLDER_ID" ] && [ -z "$GOOGLE_DRIVE_REFERENCE_FILE_ID" ]; }; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Reference analysis skipped: Google Drive OAuth secrets are not configured."
            exit 0
          fi
          mkdir -p input output
          python scripts/drive_io.py download-reference \
            --output input/reference_timing_only.mp4 \
            --metadata-output output/reference_download_metadata.json
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Analyze reference duration, scene cuts and image-plane motion
        if: steps.reference.outputs.available == 'true'
        continue-on-error: true
        run: |
          python scripts/analyze_reference.py \
            --input input/reference_timing_only.mp4 \
            --output output/reference_analysis.json \
            --sample-fps 2 --max-width 640

      - name: Install COLMAP for optional CPU sparse camera solve
        if: inputs.run_colmap == true && steps.reference.outputs.available == 'true'
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y colmap
          colmap -h | head -n 2

      - name: Run optional COLMAP CPU camera reconstruction
        if: inputs.run_colmap == true && steps.reference.outputs.available == 'true'
        continue-on-error: true
        run: |
          python scripts/solve_camera_colmap.py \
            --input input/reference_timing_only.mp4 \
            --output output/colmap_camera_poses.json \
            --sample-interval 1.5 --max-width 640 --threads 2

      - name: Build the new 3D stage, rigs and authored camera path
        continue-on-error: true
        run: |
          mkdir -p output
          blender --background -t 2 \
            --python scripts/build_blender_scene.py -- \
            --blend-output output/prism_break_3d.blend \
            --output output/Prism_Break_Original_3D_720p24_video.mp4 \
            --duration 291.318 --fps 24 --width 1280 --height 720 --threads 2
          test -s output/prism_break_3d.blend

      - name: Verify Blender CPU render works on the 3D scene
        continue-on-error: true
        run: |
          blender --background output/prism_break_3d.blend -t 2 \
            -o "$GITHUB_WORKSPACE/output/prism_break_3d_preview_" \
            -F PNG -f 480
          test -s output/prism_break_3d_preview_00480.png

      - name: Render full 3D episode on CPU and add original soundtrack
        id: render3d
        if: false
        continue-on-error: true
        run: |
          set +e
          timeout 25m blender --background output/prism_break_3d.blend -t 2 -a \
            > output/blender_render.log 2>&1
          blender_code=$?
          set -e
          if [ "$blender_code" -ne 0 ] || \
             [ ! -s output/Prism_Break_Original_3D_720p24_video.mp4 ] || \
             [ "$(stat -c%s output/Prism_Break_Original_3D_720p24_video.mp4 2>/dev/null || echo 0)" -lt 100000 ]; then
            echo "Blender render did not finish in the CPU time window (exit=$blender_code); falling back to the verified OpenCV CPU renderer."
            tail -n 50 output/blender_render.log || true
            exit 1
          fi
          python scripts/generate_score.py \
            --output output/prism_break_original_score.wav --duration 291.318
          ffmpeg -y -loglevel error \
            -i output/Prism_Break_Original_3D_720p24_video.mp4 \
            -i output/prism_break_original_score.wav \
            -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 160k \
            -t 291.318 -movflags +faststart \
            output/Prism_Break_Original_720p24_muxed.mp4
          test -s output/Prism_Break_Original_720p24_muxed.mp4
          mv output/Prism_Break_Original_720p24_muxed.mp4 output/Prism_Break_Original_720p24.mp4
          python - <<'PY'
          import json
          from pathlib import Path
          Path("output/Prism_Break_Original_720p24.json").write_text(json.dumps({
              "title": "Prism Break — Three Forces",
              "render_backend": "Blender Cycles CPU",
              "duration_target_seconds": 291.25,
              "resolution": "1280x720",
              "fps": 24,
              "art_draw_fps": 12,
              "audio": "Original procedurally synthesized score",
              "reference_frames_or_audio_reused": False
          }, indent=2), encoding="utf-8")
          PY
          echo "backend=blender_cycles_cpu" >> "$GITHUB_OUTPUT"

      - name: Render enhanced 2D fight episode with custom armored characters and energy FX
        if: steps.render3d.outcome != 'success'
        timeout-minutes: 50
        run: |
          rm -f output/Prism_Break_Original_720p24.mp4
          python - <<'PY'
          import base64, zlib
          from pathlib import Path
          root = Path("scripts/render_bundle")
          ordered = [
              "part01.b64", "part02a.b64", "part02b.b64", "part02c.b64",
              "part05.b64", "part06.b64", "part07.b64", "part08.b64",
              "part09.b64", "part10.b64",
          ]
          encoded = "".join((root / name).read_text(encoding="ascii").strip() for name in ordered)
          raw = zlib.decompress(base64.b64decode(encoded, validate=True))
          target = Path("scripts/render_2d_episode.py")
          target.write_bytes(raw)
          print(f"Recovered enhanced 2D renderer: {len(raw)} bytes")
          PY
          python -m py_compile scripts/render_2d_episode.py
          python scripts/render_2d_episode.py \
            --output output/Shadow_and_Iron_2D_960x540_12fps.mp4 \
            --duration 291.25 --fps 12 --width 960 --height 540 \
            --preset ultrafast --crf 21
          ffmpeg -y -hide_banner -loglevel error \
            -i output/Shadow_and_Iron_2D_960x540_12fps.mp4 \
            -vf "scale=1280:720:flags=lanczos,fps=24" \
            -c:v libx264 -preset ultrafast -crf 20 -pix_fmt yuv420p \
            -fps_mode cfr -c:a copy -t 291.25 -movflags +faststart \
            -metadata title="Shadows and Iron — Original 2D Fight Episode 01" \
            -metadata comment="Original armored 2D characters, choreography and procedural soundtrack" \
            output/Prism_Break_Original_720p24.mp4
          python - <<'PY'
          import json
          from pathlib import Path
          Path("output/Prism_Break_Original_720p24.json").write_text(json.dumps({
              "title": "Shadows & Iron — Original 2D Fight Episode 01",
              "render_backend": "custom_pillow_2d_cpu_12fps_upscaled_to_24fps",
              "duration_target_seconds": 291.25,
              "art_draw_fps": 12,
              "output_fps": 24,
              "source_resolution": "960x540",
              "output_resolution": "1280x720",
              "characters": ["Nightshade", "Ironbound"],
              "features": ["armored articulated silhouettes", "energy katana", "power auras",
                           "lightning", "impact shock rings", "multi-phase backgrounds",
                           "cinematic zooms and dutch roll", "original procedural score"],
              "reference_frames_or_audio_reused": False
          }, indent=2), encoding="utf-8")
          PY
          echo "RENDER_BACKEND=custom_pillow_2d_cpu_12fps_upscaled_to_24fps" >> "$GITHUB_ENV"

      - name: Record the 3D render backend
        if: steps.render3d.outcome == 'success'
        run: echo "RENDER_BACKEND=blender_cycles_cpu" >> "$GITHUB_ENV"

      - name: Verify final MP4 duration, streams, resolution and frame rate
        run: |
          test -s output/Prism_Break_Original_720p24.mp4
          python - <<'PY'
          import json, os, subprocess
          path = "output/Prism_Break_Original_720p24.mp4"
          proc = subprocess.run(
              ["ffprobe", "-v", "error", "-show_entries",
               "format=duration,size:stream=codec_type,codec_name,width,height,avg_frame_rate,duration",
               "-of", "json", path], capture_output=True, text=True, check=True
          )
          data = json.loads(proc.stdout)
          video = next(s for s in data["streams"] if s["codec_type"] == "video")
          audio = next(s for s in data["streams"] if s["codec_type"] == "audio")
          duration = float(data["format"]["duration"])
          assert (video["width"], video["height"]) == (1280, 720), video
          assert video["avg_frame_rate"] == "24/1", video
          assert audio["codec_name"] == "aac", audio
          assert abs(duration - 291.25) < 0.25, duration
          assert int(data["format"]["size"]) > 1_000_000
          report = {
              "verified": True, "render_backend": os.environ.get("RENDER_BACKEND", "unknown"),
              "duration_seconds": duration, "target_duration_seconds": 291.25,
              "duration_delta_seconds": round(duration - 291.25, 6),
              "video_stream": video, "audio_stream": audio,
              "file_size_bytes": int(data["format"]["size"]),
              "reference_media_reused": False
          }
          with open("output/render_verification.json", "w", encoding="utf-8") as f:
              json.dump(report, f, indent=2)
          print(json.dumps(report, indent=2))
          PY

      - name: Upload video, source scene and diagnostics as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Prism-Break-Original-720p24
          path: |
            output/Prism_Break_Original_720p24.mp4
            output/Prism_Break_Original_720p24.json
            output/prism_break_3d.blend
            output/prism_break_3d_preview_00480.png
            output/reference_download_metadata.json
            output/reference_analysis.json
            output/colmap_camera_poses.json
            output/render_verification.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload final MP4 to Google Drive when OAuth secrets are configured
        if: env.GOOGLE_DRIVE_CLIENT_ID != '' && env.GOOGLE_DRIVE_CLIENT_SECRET != '' && env.GOOGLE_DRIVE_REFRESH_TOKEN != '' && (env.GOOGLE_DRIVE_OUTPUT_FOLDER_ID != '' || env.GOOGLE_DRIVE_FOLDER_ID != '')
        continue-on-error: true
        run: |
          python scripts/drive_io.py upload-final \
            --input output/Prism_Break_Original_720p24.mp4 \
            --name "Prism_Break_Original_720p24_run${GITHUB_RUN_NUMBER}.mp4"

      - name: Publish MP4 and editable Blender scene to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: shadows-iron-${{ github.run_id }}-${{ github.run_attempt }}
          name: "Shadows & Iron — Enhanced 2D Episode 01 (run ${{ github.run_number }})"
          body: |
            Original animated combat episode generated by the Dynamic Battle Engine.
            - Video: 1280x720, 24 fps output, approximately 4:51; key animation drawings are authored at 12 fps.
            - Custom articulated 2D armor, energy blade, auras, lightning, shock rings, and original soundtrack.
            - Blender source scene is included for further 3D development.
            - Render backend and verification report are included in the build artifact.
            - Source frames, source audio and reference camera poses are not used to recreate the original work.
          files: |
            output/Prism_Break_Original_720p24.mp4
            output/prism_break_3d.blend
            output/render_verification.json
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
