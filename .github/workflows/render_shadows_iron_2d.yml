name: Shadows and Iron — Enhanced 2D Episode

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/render_bundle/**"
      - ".github/workflows/render_shadows_iron_2d.yml"

permissions:
  contents: write

concurrency:
  group: shadows-iron-2d-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render-episode:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
      GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
      GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
      GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
      GOOGLE_DRIVE_OUTPUT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_OUTPUT_FOLDER_ID }}
    steps:
      - name: Check out the production source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg and 2D renderer dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install numpy pillow
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Rebuild the enhanced renderer from repository bundle
        run: |
          python - <<'PY'
          import base64, zlib
          from pathlib import Path
          root = Path("scripts/render_bundle")
          ordered = [
              "part01.b64", "part02a.b64", "part02b.b64", "part02c.b64",
              "part05.b64", "part06.b64", "part07.b64", "part08.b64",
              "part09.b64", "part10.b64",
          ]
          encoded = "".join((root / name).read_text(encoding="ascii").strip() for name in ordered)
          compressed = base64.b64decode(encoded, validate=True)
          raw = zlib.decompress(compressed)
          if len(raw) < 40000:
              raise RuntimeError(f"Renderer source is too short: {len(raw)} bytes")
          Path("scripts/render_2d_episode.py").write_bytes(raw)
          print(f"RENDERER_SOURCE_REBUILT bytes={len(raw)}")
          PY
          python -m py_compile scripts/render_2d_episode.py

      - name: Test renderer with a short sample
        run: |
          mkdir -p output
          python scripts/render_2d_episode.py \
            --output output/smoke.mp4 --duration 4 --fps 12 \
            --width 640 --height 360 --preset ultrafast --crf 23
          ffprobe -v error -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 output/smoke.mp4

      - name: Render original armored 2D combat episode at native 24 fps
        run: |
          python scripts/render_2d_episode.py \
            --output output/Shadow_and_Iron_2D_960x540_24fps.mp4 \
            --duration 291.25 --fps 24 --width 960 --height 540 \
            --preset ultrafast --crf 21
          test -s output/Shadow_and_Iron_2D_960x540_24fps.mp4

      - name: Upscale and encode 1440p24 distribution master
        run: |
          ffmpeg -y -hide_banner -loglevel error \
            -i output/Shadow_and_Iron_2D_960x540_24fps.mp4 \
            -map 0:v:0 -map 0:a:0 \
            -vf "scale=2560:1440:flags=lanczos" \
            -c:v libx264 -preset veryfast -crf 19 -pix_fmt yuv420p \
            -r 24 -fps_mode cfr -c:a aac -b:a 192k -ar 48000 -ac 2 \
            -t 291.25 -movflags +faststart \
            -metadata title="Shadows and Iron — Original 2D Fight Episode 01 — 1440p24" \
            -metadata comment="Original 2D character animation rendered at 24 fps and upscaled to 2560x1440" \
            output/Shadow_and_Iron_2D_Episode01_FINAL_1440p24.mp4
          test -s output/Shadow_and_Iron_2D_Episode01_FINAL_1440p24.mp4
          ffmpeg -v error -i output/Shadow_and_Iron_2D_Episode01_FINAL_1440p24.mp4 -f null -

      - name: Verify final resolution, exact frame count, frame rate, and audio
        run: |
          python - <<'PY'
          import json, re, subprocess
          from pathlib import Path
          path = "output/Shadow_and_Iron_2D_Episode01_FINAL_1440p24.mp4"
          proc = subprocess.run(
              ["ffprobe", "-v", "error", "-count_frames", "-show_entries",
               "format=duration,size:stream=codec_name,codec_type,width,height,avg_frame_rate,nb_read_frames,duration,sample_rate,channels",
               "-of", "json", path], text=True, capture_output=True, check=True
          )
          data = json.loads(proc.stdout)
          video = next(s for s in data["streams"] if s["codec_type"] == "video")
          audio = next(s for s in data["streams"] if s["codec_type"] == "audio")
          duration = float(data["format"]["duration"])
          audio_duration = float(audio.get("duration", duration))
          frame_count = int(video["nb_read_frames"])
          expected_frames = round(291.25 * 24)
          assert (int(video["width"]), int(video["height"])) == (2560, 1440), video
          assert video["avg_frame_rate"] == "24/1", video
          assert frame_count == expected_frames == 6990, (frame_count, expected_frames)
          assert audio["codec_name"] == "aac" and int(audio["sample_rate"]) == 48000 and int(audio["channels"]) == 2, audio
          assert abs(duration - 291.25) < 0.25, duration
          assert abs(audio_duration - duration) < 0.5, (audio_duration, duration)
          size = int(data["format"]["size"])
          assert size > 5_000_000, size
          volume = subprocess.run(
              ["ffmpeg", "-hide_banner", "-i", path, "-vn", "-af", "volumedetect", "-f", "null", "-"],
              text=True, capture_output=True, check=True
          )
          match = re.search(r"mean_volume:\s*(-?\d+(?:\.\d+)?|-inf) dB", volume.stderr)
          assert match and match.group(1) != "-inf", volume.stderr[-2000:]
          report = {
              "verified": True,
              "title": "Shadows & Iron — Original 2D Fight Episode 01",
              "renderer": "Pillow 2D renderer at native 24 fps + FFmpeg Lanczos upscale",
              "duration_seconds": duration,
              "target_duration_seconds": 291.25,
              "resolution": "2560x1440",
              "distribution_fps": 24,
              "expected_frame_count": expected_frames,
              "actual_decoded_frame_count": frame_count,
              "video_stream": video,
              "audio_stream": audio,
              "audio_duration_seconds": audio_duration,
              "audio_mean_volume_db": float(match.group(1)),
              "file_size_bytes": size,
              "full_file_decode_test": "passed",
              "source_reference_frames_or_audio_reused": False,
              "notes": "Original standalone 2D episode. The output is upscaled to 1440p; it is not a frame-exact repaint of source footage."
          }
          Path("output/Shadow_and_Iron_2D_Episode01_FINAL_1440p24.json").write_text(json.dumps(report, indent=2), encoding="utf-8")
          print(json.dumps(report, indent=2))
          PY

      - name: Upload validated episode as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shadows-and-Iron-Enhanced-2D-Final
          path: |
            output/Shadow_and_Iron_2D_Episode01_FINAL_1440p24.mp4
            output/Shadow_and_Iron_2D_Episode01_FINAL_1440p24.json
            scripts/render_2d_episode.py
          if-no-files-found: error
          retention-days: 30

      - name: Publish final episode to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: shadows-iron-1440p24-${{ github.run_id }}-${{ github.run_attempt }}
          name: "Shadows & Iron — 1440p24 Final Episode 01 (run ${{ github.run_number }})"
          body: |
            Original action episode with custom armored 2D combatants, energy effects, impact rings,
            environmental scene changes, and a procedural soundtrack.
            Master target: 2560x1440 at native 24 fps, 6,990 frames, approximately 4m 51.25s.
            This is an original standalone animation, not a frame-exact repaint of the reference footage.
          files: |
            output/Shadow_and_Iron_2D_Episode01_FINAL_1440p24.mp4
            output/Shadow_and_Iron_2D_Episode01_FINAL_1440p24.json
          fail_on_unmatched_files: false
          draft: false
          prerelease: false

      - name: Upload final MP4 to Google Drive when OAuth is configured
        if: env.GOOGLE_DRIVE_CLIENT_ID != '' && env.GOOGLE_DRIVE_CLIENT_SECRET != '' && env.GOOGLE_DRIVE_REFRESH_TOKEN != '' && (env.GOOGLE_DRIVE_OUTPUT_FOLDER_ID != '' || env.GOOGLE_DRIVE_FOLDER_ID != '')
        run: |
          python scripts/drive_io.py upload-final \
            --input output/Shadow_and_Iron_2D_Episode01_FINAL_1440p24.mp4 \
            --name "Shadows_and_Iron_Episode01_1440p24_run${{ github.run_number }}.mp4"
