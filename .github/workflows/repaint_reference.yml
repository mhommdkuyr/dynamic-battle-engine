name: Frame-Exact 2D Character Repaint

on:
  workflow_dispatch:
    inputs:
      reference_name:
        description: "Drive reference MP4 name"
        required: true
        default: "Red vs Black 2023 (by MicroMist)_720p.mp4"
      crf:
        description: "H.264 quality (lower is higher quality)"
        required: true
        default: "16"
      preset:
        description: "x264 encoding preset"
        required: true
        default: "veryfast"
  push:
    branches: [main]
    paths:
      - "scripts/anime_cinematic_pass.py"
      - ".github/workflows/repaint_reference.yml"

permissions:
  contents: write

concurrency:
  group: frame-exact-repaint-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repaint-source-frames:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
      GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
      GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
      GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
      GOOGLE_DRIVE_OUTPUT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_OUTPUT_FOLDER_ID }}
      GOOGLE_DRIVE_REFERENCE_FILE_ID: ${{ secrets.GOOGLE_DRIVE_REFERENCE_FILE_ID }}

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Set up Python and image processing dependencies
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install OpenCV/NumPy
        run: |
          python -m pip install --upgrade pip
          pip install numpy opencv-python-headless
          python -m py_compile scripts/repaint_reference.py scripts/drive_io.py scripts/anime_cinematic_pass.py

      - name: Validate required Drive OAuth secrets
        run: |
          if [ -z "$GOOGLE_DRIVE_CLIENT_ID" ] || \
             [ -z "$GOOGLE_DRIVE_CLIENT_SECRET" ] || \
             [ -z "$GOOGLE_DRIVE_REFRESH_TOKEN" ] || \
             { [ -z "$GOOGLE_DRIVE_FOLDER_ID" ] && [ -z "$GOOGLE_DRIVE_REFERENCE_FILE_ID" ]; }; then
            echo "::error::Configure GOOGLE_DRIVE_CLIENT_ID, GOOGLE_DRIVE_CLIENT_SECRET, GOOGLE_DRIVE_REFRESH_TOKEN, and GOOGLE_DRIVE_FOLDER_ID or GOOGLE_DRIVE_REFERENCE_FILE_ID under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Download the exact Drive reference
        run: |
          mkdir -p input output
          export GOOGLE_DRIVE_REFERENCE_NAME="${{ inputs.reference_name }}"
          python scripts/drive_io.py download-reference \
            --output input/reference_original.mp4 \
            --metadata-output output/reference_source.json
          test -s input/reference_original.mp4
          ffprobe -v error -show_entries format=duration,size:stream=codec_type,codec_name,width,height,avg_frame_rate \
            -of json input/reference_original.mp4 > output/source_probe.json

      - name: Repaint original frames with new character palettes and 2D armor
        run: |
          python scripts/repaint_reference.py \
            --input input/reference_original.mp4 \
            --output output/Red_vs_Black_2023_Custom_2D_Cast_720p.mp4 \
            --crf "${{ inputs.crf }}" \
            --preset "${{ inputs.preset }}" \
            --mux-audio

      - name: Add cinematic hair, face, armor, and ruined-environment pass at 1440p24
        run: |
          python scripts/anime_cinematic_pass.py \
            --input input/reference_original.mp4 \
            --base-video output/Red_vs_Black_2023_Custom_2D_Cast_720p.mp4 \
            --output output/Red_vs_Black_2023_Cinematic_1440p24.mp4 \
            --crf 16 --preset veryfast --scale 2 --output-fps 24 --mux-audio
          test -s output/Red_vs_Black_2023_Cinematic_1440p24.mp4
          test -s output/Red_vs_Black_2023_Cinematic_1440p24.json
          ffmpeg -v error -i output/Red_vs_Black_2023_Cinematic_1440p24.mp4 -f null -

      - name: Verify exact timing, 1440p24 frame count, audio and decode integrity
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          source = json.loads(subprocess.run(
              ["ffprobe", "-v", "error", "-count_frames", "-show_entries",
               "format=duration,size:stream=codec_type,codec_name,width,height,avg_frame_rate,nb_read_frames,duration",
               "-of", "json", "input/reference_original.mp4"],
              text=True, capture_output=True, check=True).stdout)
          final = json.loads(subprocess.run(
              ["ffprobe", "-v", "error", "-count_frames", "-show_entries",
               "format=duration,size:stream=codec_type,codec_name,width,height,avg_frame_rate,nb_read_frames,duration,sample_rate,channels",
               "-of", "json", "output/Red_vs_Black_2023_Cinematic_1440p24.mp4"],
              text=True, capture_output=True, check=True).stdout)
          sv = next(s for s in source["streams"] if s["codec_type"] == "video")
          fv = next(s for s in final["streams"] if s["codec_type"] == "video")
          fa = next(s for s in final["streams"] if s["codec_type"] == "audio")
          source_fps = float(sv["avg_frame_rate"].split("/")[0]) / float(sv["avg_frame_rate"].split("/")[1])
          source_frame_count = int(sv["nb_read_frames"])
          target_frame_count = round(source_frame_count / source_fps * 24)
          assert (int(sv["width"]),int(sv["height"])) == (1280,720), sv
          assert (int(fv["width"]),int(fv["height"])) == (2560,1440), fv
          assert fv["avg_frame_rate"] == "24/1", fv
          assert int(fv["nb_read_frames"]) == target_frame_count, (int(fv["nb_read_frames"]),target_frame_count)
          assert fa["codec_name"] in ("aac","mp3","ac3","opus","vorbis"), fa
          assert int(fa.get("sample_rate", "48000")) > 0, fa
          source_duration = float(source["format"]["duration"])
          final_duration = float(final["format"]["duration"])
          duration_delta = abs(final_duration-source_duration)
          assert duration_delta < 0.15, (source_duration,final_duration)
          import re
          volume = subprocess.run(
            ["ffmpeg","-hide_banner","-i","output/Red_vs_Black_2023_Cinematic_1440p24.mp4",
             "-vn","-af","volumedetect","-f","null","-"],
            text=True,capture_output=True,check=True)
          volume_lines = [line for line in volume.stderr.splitlines() if "mean_volume:" in line]
          mean_db = volume_lines[-1].split("mean_volume:",1)[1].strip().split()[0] if volume_lines else "-inf"
          assert mean_db != "-inf", volume.stderr[-2000:]
          report = {
            "verified": True,
            "source_video_stream": sv,
            "final_video_stream": fv,
            "final_audio_stream": fa,
            "source_duration_seconds": source_duration,
            "final_duration_seconds": final_duration,
            "duration_delta_seconds": duration_delta,
            "source_frame_count": source_frame_count,
            "final_frame_count": int(fv["nb_read_frames"]),
            "expected_output_frame_count_at_24fps": target_frame_count,
            "camera_motion_and_frame_order": "source timebase retained; CFR output set to 24 fps",
            "source_audio": "retained and copied from the reference",
            "character_treatment": "color-specific character repaint plus stable hair, face, and armor overlays",
            "environment_treatment": "stylized ruined-city/concrete detail, applied to eligible regions",
            "method": "per-frame masks and mask-clipped 2D overpaint with Lanczos 2x upscale",
            "audio_mean_volume_db": float(match.group(1)),
            "full_file_decode_test": "passed"
          }
          Path("output/cinematic_1440p24_verification.json").write_text(json.dumps(report,indent=2),encoding="utf-8")
          print(json.dumps(report,indent=2))
          PY

      - name: Upload verified result as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: Frame-Exact-2D-Cast-Repaint
          path: |
            output/Red_vs_Black_2023_Cinematic_1440p24.mp4
            output/Red_vs_Black_2023_Cinematic_1440p24.json
            output/cinematic_1440p24_verification.json
            output/repaint_verification.json
            output/source_probe.json
            output/reference_source.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload output to the configured Drive folder
        if: env.GOOGLE_DRIVE_CLIENT_ID != '' && env.GOOGLE_DRIVE_CLIENT_SECRET != '' && env.GOOGLE_DRIVE_REFRESH_TOKEN != '' && (env.GOOGLE_DRIVE_OUTPUT_FOLDER_ID != '' || env.GOOGLE_DRIVE_FOLDER_ID != '')
        continue-on-error: true
        run: |
          python scripts/drive_io.py upload-final \
            --input output/Red_vs_Black_2023_Cinematic_1440p24.mp4 \
            --name "Red_vs_Black_2023_Cinematic_1440p24_run${{ github.run_number }}.mp4"

      - name: Publish verified repaint to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cinematic-repaint-1440p24-${{ github.run_id }}-${{ github.run_attempt }}
          name: "Cinematic 2D Cast — 1440p24 (run ${{ github.run_number }})"
          body: |
            Frame-based recolor and character-design pass on the user-authorized source footage.
            Original source frame order/camera timing are preserved, output is constant-frame-rate 24 fps,
            output dimensions are 2560x1440, and the source soundtrack is retained.
            Hair/face/armor overlays and a stylized ruined-city environment pass are added where detection is confident.
            This is a mask-based repaint and upscale, not perfect generative clean-plate reconstruction.
          files: |
            output/Red_vs_Black_2023_Cinematic_1440p24.mp4
            output/cinematic_1440p24_verification.json
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
